<script>
const SHEET_ID = "1zdMVog12VFdow4r3rUMItMaF5X35hyVu_8x8BXwuoJ0";
// Minden a szervezők táblázatából jön, az oldal semmit nem számol újra.
// Külön tartományok, mert a gviz a vegyes típusú oszlopokban kinullázza a kisebbségi típust.
const csvUrl = range => `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&headers=0&gid=0&range=${range}`;
const RANGES = { matches: "B5:H40", table: "J5:R14", final: "J14:P30", scorers: "T5:W80" };
const REFRESH_MS = 30000;
const DAYS = ["2026-11-19", "2026-11-20"];   // a torna napjai; a menetrendben az idő visszaugrása jelzi a napváltást
const DAY_LABEL = ["november 19., csütörtök", "november 20., péntek"];
const LIVE_MAX_MIN = 55;                       // 2 × 20 perc + 5 perc szünet + ráhagyás
const ARCHIVE_AFTER_MIN = 60;

const FALLBACK = [
 ["1.","10:00","EKKE","","","ME","Körmérkőzés"],
 ["2.","11:00","BME","","","SZE","Körmérkőzés"],
 ["—","12:00","Ünnepélyes megnyitó","","","","Hivatalos program"],
 ["3.","12:15","ME","","","ELTE","Körmérkőzés"],
 ["4.","13:15","EKKE","","","SZE","Körmérkőzés"],
 ["5.","14:15","ME","","","BME","Körmérkőzés"],
 ["6.","15:15","EKKE","","","ELTE","Körmérkőzés"],
 ["7.","09:00","SZE","","","ELTE","Körmérkőzés"],
 ["8.","10:00","EKKE","","","BME","Körmérkőzés"],
 ["9.","11:00","ME","","","SZE","Körmérkőzés"],
 ["10.","12:00","BME","","","ELTE","Körmérkőzés"],
 ["—","13:00","🏆 Ünnepélyes eredményhirdetés és díjátadó","","","","Hivatalos program"]
];

const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} }
};
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const pad = x => String(x).padStart(2, "0");
const fmtMin = m => `${Math.floor(m / 60)}:${pad(m % 60)}`;

function parseCSV(text) {
  const rows = []; let row = [], cur = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"' && text[i + 1] === '"') { cur += '"'; i++; }
      else if (c === '"') q = false;
      else cur += c;
    } else if (c === '"') q = true;
    else if (c === ",") { row.push(cur); cur = ""; }
    else if (c === "\n") { row.push(cur); rows.push(row); row = []; cur = ""; }
    else if (c !== "\r") cur += c;
  }
  if (cur || row.length) { row.push(cur); rows.push(row); }
  return rows;
}
const goal = v => { const t = String(v ?? "").trim(); return t === "" || isNaN(+t) ? null : Math.round(+t); };
const num = v => { const x = +String(v ?? "").trim(); return isNaN(x) ? 0 : x; };

// Menetrend: a meccssorok („1.”) és a programpontok („—”) idő szerint; napváltás, ha az idő visszaugrik.
function toItems(rows) {
  let day = 0, prev = -1;
  return rows.filter(r => /^(\d+\.|—|-)$/.test((r[0] || "").trim()) && /\d{1,2}:\d{2}/.test(r[1] || "")).map(r => {
    const [h, m] = r[1].trim().split(":").map(Number), minutes = h * 60 + m;
    if (prev >= 0 && minutes < prev) day++;
    prev = minutes;
    const no = parseInt(r[0], 10);
    if (isNaN(no)) return { prog: true, day, minutes, time: r[1].trim(), title: (r[2] || "").trim() };
    return { no, day, minutes, time: r[1].trim(), home: (r[2] || "").trim(), away: (r[5] || "").trim(),
             hg: goal(r[3]), ag: goal(r[4]), stake: (r[6] || "").trim() };
  });
}
const played = m => m.hg !== null && m.ag !== null;

function toTable(rows) {
  let note = "";
  const out = [];
  for (const r of rows) {
    const k = (r[0] || "").trim();
    if (/pontoz/i.test(k)) note = k.replace(/^[^\p{L}]+/u, "");
    if (k && /^\d+$/.test((r[1] || "").trim()) && !/csapat/i.test(k))
      out.push({ name: k, m: num(r[1]), w: num(r[2]), d: num(r[3]), l: num(r[4]), goals: (r[5] || "").replace(/\s/g, ""), gd: num(r[6]), p: num(r[7]), gf: num(r[8]) });
  }
  // Ugyanazok a kulcsok, mint a szervezők táblázatában: pont, gólkülönbség, rúgott gól (csökkenő).
  const rows2 = out.map((s, i) => ({ ...s, i })).sort((a, b) => b.p - a.p || b.gd - a.gd || b.gf - a.gf || a.i - b.i);
  return { rows: rows2, note };
}
const toFinal = rows => rows.filter(r => /helyezett/i.test(r[0] || "")).map(r => ({ label: r[0].trim(), team: (r[3] || "").trim(), goals: (r[5] || "").replace(/\s/g, ""), gd: num(r[6]) }));
const toScorers = rows => rows.filter(r => (r[1] || "").trim() && !/játékos/i.test(r[1])).map(r => ({ rank: (r[0] || "").trim(), name: r[1].trim(), team: (r[2] || "").trim(), goals: num(r[3]) }));

let ITEMS = toItems(FALLBACK);
let TABLE = { rows: [], note: "" }, FINAL = [], SCORERS = [];
let lastOk = null, failed = false;
let tab = store.get("mefob-tab") || "meccsek";
let mine = store.get("mefob-team") || "";
const isMine = n => mine && n === mine;
const matches = () => ITEMS.filter(x => !x.prog);

function todayKey() { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
const dayIdx = () => DAYS.indexOf(todayKey());
const afterAll = () => todayKey() > DAYS[DAYS.length - 1];
const beforeAll = () => todayKey() < DAYS[0];
function nowMinutes() { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); }
// „Most” a menetrend idővonalán: (nap, perc); a torna előtt -1, utána végtelen.
function nowPos() { if (beforeAll()) return -1; if (afterAll()) return Infinity; const i = dayIdx(); return i < 0 ? -1 : i * 1440 + nowMinutes(); }
const pos = x => x.day * 1440 + x.minutes;
function ceremonyPos() {
  const c = ITEMS.find(x => x.prog && /eredményhirdetés/i.test(x.title));
  if (c) return pos(c);
  const ms = matches(); return ms.length ? pos(ms[ms.length - 1]) + 60 : Infinity;
}
const allPlayed = () => matches().length > 0 && matches().every(played);

// Egy meccs „fut”, amíg a következő el nem kezdődik, legfeljebb LIVE_MAX_MIN percig. Futó meccs eredménye még változhat.
function runningMatch() {
  const n = nowPos(); if (n < 0 || n === Infinity) return null;
  const ms = matches().slice().sort((a, b) => pos(a) - pos(b));
  for (let i = ms.length - 1; i >= 0; i--) {
    const m = ms[i], next = ms[i + 1];
    if (n < pos(m)) continue;
    if (next && (played(next) || n >= pos(next))) return null;
    if (n >= pos(m) + LIVE_MAX_MIN) return null;
    return m;
  }
  return null;
}
const isLive = m => { const r = runningMatch(); return !!r && r.no === m.no; };
const ceremonyReached = () => nowPos() >= ceremonyPos();
const archived = () => afterAll() || nowPos() >= ceremonyPos() + ARCHIVE_AFTER_MIN;
const finalKnown = () => allPlayed() && !runningMatch() && FINAL.length > 0;

function dayWord(d) {
  const i = dayIdx();
  if (i === d) return "ma";
  if (i >= 0 && d === i + 1) return "holnap";
  return DAY_LABEL[d].split(", ")[1];
}

function podiumTop() {
  if (!finalKnown()) return "";
  const top = FINAL.slice(0, 3);
  if (top.length < 3) return "";
  const col = i => `<div class="col p${i + 1}"><div class="who">${esc(top[i].team)}</div><div class="blk num">${i + 1}</div></div>`;
  return `<div class="spot final"><div class="lbl"><b>Végeredmény</b><span>Floorball MEFOB 2026</span></div>
    <div class="stand" role="group" aria-label="Dobogó: 1. ${esc(top[0].team)}, 2. ${esc(top[1].team)}, 3. ${esc(top[2].team)}">${col(1)}${col(0)}${col(2)}</div>
    <button type="button" class="more" data-goto="tabella">Teljes végeredmény</button></div>`;
}

function renderSpot() {
  const el = $("spot");
  if (ceremonyReached() || afterAll()) { const p = podiumTop(); if (p) { el.innerHTML = p; return; } }
  const live = runningMatch(), n = nowPos();
  const next = live || matches().find(m => !played(m) && pos(m) > n);
  if (!next) {
    const c = ITEMS.find(x => x.prog && /eredményhirdetés/i.test(x.title));
    el.innerHTML = `<div class="spot"><div class="lbl"><b>Vége a körmérkőzésnek</b></div><div class="stake">${c ? `Eredményhirdetés és díjátadó ${dayWord(c.day)} ${esc(c.time)}-kor. ` : ""}A végeredmény a Tabella fülön.</div></div>`;
    return;
  }
  const sc = live && played(live) ? `<div class="sc livesc">${live.hg}:${live.ag}</div>` : `<div class="sc">–</div>`;
  el.innerHTML = `<div class="spot">
    <div class="lbl"><b>${live ? "● Most a pályán" : "Következő meccs"}</b><span>${next.no}. meccs · ${dayWord(next.day)} ${esc(next.time)}</span></div>
    <div class="teams"><div class="t">${esc(next.home)}</div>${sc}<div class="t">${esc(next.away)}</div></div>
    <div class="stake">${live ? "Az eredmény még változhat · " : ""}${esc(next.stake)}</div></div>`;
}

function itemRow(x) {
  if (x.prog) return `<div class="m prog"><div class="meta"><span><b class="num">${esc(x.time)}</b></span><span>Hivatalos program</span></div><div class="pn">${esc(x.title)}</div></div>`;
  const p = played(x), live = isLive(x);
  const cls = ["m", (isMine(x.home) || isMine(x.away)) ? "mine" : "", live ? "now" : ""].join(" ");
  const team = (n, side, win) => `<span class="n ${side}${win ? " w" : ""}">${esc(n)}</span>`;
  return `<div class="${cls}">
    <div class="meta"><span><b class="num">${esc(x.time)}</b> · ${x.no}. meccs${live ? ` <em class="livetag">● élő, még változhat</em>` : ""}</span><span>${esc(x.stake)}</span></div>
    <div class="vs">${team(x.home, "h", p && !live && x.hg > x.ag)}
      <span class="score num${p ? "" : " open"}${live ? " live" : ""}">${p ? `${x.hg}:${x.ag}` : "–"}</span>
      ${team(x.away, "a", p && !live && x.ag > x.hg)}</div></div>`;
}

function renderMatches() {
  const days = [...new Set(ITEMS.map(x => x.day))];
  $("p-meccsek").innerHTML = days.map(d => `<h2>${d + 1}. nap</h2><p class="sub">${esc(DAY_LABEL[d] || "")}</p>
    <div class="list">${ITEMS.filter(x => x.day === d).map(itemRow).join("")}</div>`).join("") +
    `<p class="note">5 csapatos körmérkőzés, mindenki mindenkivel egyszer. Játékidő 2 × 20 perc futóórával, 5 perc szünettel.</p>`;
}

function renderTable() {
  const T = TABLE, live = runningMatch();
  const tbl = T.rows.length ? `<div class="tbl"><table class="num">
    <thead><tr><th></th><th>Csapat</th><th>M</th><th>Gy</th><th>D</th><th>V</th><th>Gól</th><th>GK</th><th>P</th></tr></thead><tbody>
    ${T.rows.map((s, i) => `<tr class="${isMine(s.name) ? "mine" : ""}"><td class="pos">${i + 1}</td><td class="tn">${esc(s.name)}</td>
      <td>${s.m}</td><td>${s.w}</td><td>${s.d}</td><td>${s.l}</td><td>${esc(s.goals)}</td><td>${s.gd > 0 ? "+" : ""}${s.gd}</td><td class="p">${s.p}</td></tr>`).join("")}
    </tbody></table></div>` : `<p class="sub">Betöltés…</p>`;
  const fin = finalKnown()
    ? `<div class="podium">${FINAL.map((f, i) => `<div class="pl${i < 3 ? " medal" : ""}${isMine(f.team) ? " mine" : ""}"><div class="rk num">${i + 1}.</div>
        <div><div class="tn">${esc(f.team)}</div><div class="br">${esc(f.label.replace(/^\d+\.\s*/, ""))}</div></div></div>`).join("")}</div>`
    : `<div class="podium"><div class="pl"><div></div><div class="tn ph">Az utolsó meccs után dől el.</div></div></div>`;
  $("p-tabella").innerHTML = `<h2>Tabella${live ? ` <em class="livetag">● élő meccs, még változhat</em>` : ""}</h2>${tbl}
    ${T.note ? `<p class="note">${esc(T.note)}</p>` : ""}
    <h2>Végső helyezés</h2><p class="sub">A szervezők táblázatából, a körmérkőzés végén.</p>${fin}`;
}

function renderScorers() {
  const L = SCORERS;
  $("p-gollovok").innerHTML = `<h2>Góllövőlista</h2><p class="sub">A szervezők jegyzőkönyve alapján.</p>` + (L.length
    ? `<div class="podium sc-list">${L.map(s => `<div class="pl${isMine(s.team) ? " mine" : ""}"><div class="rk num">${esc(s.rank)}.</div>
        <div><div class="tn">${esc(s.name)}</div><div class="br">${esc(s.team)}</div></div><div class="g num">${s.goals}</div></div>`).join("")}</div>`
    : `<div class="podium"><div class="pl"><div></div><div class="tn ph">Még nincs gól a listán.</div></div></div>`);
}

function renderTeamPicker() {
  const names = new Set();
  matches().forEach(m => { names.add(m.home); names.add(m.away); });
  const opts = [...names].filter(Boolean).sort((a, b) => a.localeCompare(b, "hu"));
  $("team").innerHTML = `<option value="">nincs kiválasztva</option>` + opts.map(n => `<option${n === mine ? " selected" : ""}>${esc(n)}</option>`).join("");
}

function renderStatus() {
  const dot = $("dot"), st = $("stamp");
  if (failed) { dot.className = "dot err"; st.textContent = lastOk ? `Nincs kapcsolat · utolsó adat ${lastOk}` : "Nincs kapcsolat · az alap menetrend látszik"; }
  else if (archived()) { dot.className = "dot"; st.textContent = "Végeredmény · lezárva"; }
  else if (lastOk) { dot.className = "dot live"; st.textContent = `Élő · frissítve ${lastOk}`; }
  $("reload").hidden = archived();
}

function render() {
  if (ceremonyReached() && finalKnown() && store.get("mefob-final") !== "1") { tab = "tabella"; store.set("mefob-final", "1"); }
  renderSpot(); renderMatches(); renderTable(); renderScorers(); renderStatus();
  for (const b of document.querySelectorAll(".tabs button")) b.setAttribute("aria-selected", b.dataset.tab === tab);
  for (const id of ["meccsek", "tabella", "gollovok"]) $("p-" + id).hidden = id !== tab;
}

async function load() {
  try {
    const get = async range => {
      const res = await fetch(csvUrl(range) + "&t=" + Date.now(), { cache: "no-store" });
      if (!res.ok) throw new Error(res.status);
      return parseCSV(await res.text());
    };
    const [m, t, f, s] = await Promise.all([get(RANGES.matches), get(RANGES.table), get(RANGES.final), get(RANGES.scorers)]);
    const it = toItems(m);
    if (it.filter(x => !x.prog).length < 10) throw new Error("hiányos adat");
    ITEMS = it; TABLE = toTable(t); FINAL = toFinal(f); SCORERS = toScorers(s); failed = false;
    lastOk = new Date().toLocaleTimeString("hu-HU", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
    store.set("mefob-cache", JSON.stringify({ ITEMS, TABLE, FINAL, SCORERS, lastOk }));
  } catch (e) { failed = true; }
  render();
}

try { const c = JSON.parse(store.get("mefob-cache") || "null"); if (c && c.ITEMS) ({ ITEMS, TABLE, FINAL, SCORERS, lastOk } = c); } catch {}
renderTeamPicker(); render(); load();
const refreshTimer = setInterval(() => { if (archived()) { clearInterval(refreshTimer); render(); } else load(); }, REFRESH_MS);
document.addEventListener("visibilitychange", () => { if (!document.hidden && !archived()) load(); });
$("reload").addEventListener("click", load);
document.querySelector(".tabs").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  tab = b.dataset.tab; store.set("mefob-tab", tab); render(); window.scrollTo({ top: $("spot").offsetTop, behavior: "smooth" });
});
$("spot").addEventListener("click", e => {
  const b = e.target.closest("[data-goto]"); if (!b) return;
  tab = b.dataset.goto; store.set("mefob-tab", tab); render(); window.scrollTo({ top: document.querySelector("nav").offsetTop, behavior: "smooth" });
});
const clockTimer = setInterval(() => { render(); if (archived()) clearInterval(clockTimer); }, 60000);
$("team").addEventListener("change", e => { mine = e.target.value; store.set("mefob-team", mine); render(); });
</script>
</body>
</html>
